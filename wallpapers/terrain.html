<!doctype html>
<html><head><meta charset="utf-8"><title>JobTrail Terrain</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}canvas{display:block}</style>
</head><body>
<script>
// JobTrail Terrain: your last 30 days of jobs as a 3D landscape. One ridge per day (oldest at the back, today at the
// front in amber); the height along each ridge is how many jobs were running at that time of day (10-minute steps,
// both Macs). The camera drifts and turns slowly; a time cursor sweeps across the day and reads the values out.
// Data: window.jtHistory64(base64 JSON of /api/history?days=30), sent by the screen saver. ?still=1 freezes time.
(() => {
  const STILL = !!new URLSearchParams(location.search).get('still');
  const W = 1728, H = 1117, BINS = 144; let DAYS = 30;
  const C = { bg: '#000', line: '#d6d6d6', mid: '#7d7d7d', dim: '#3c3c3c', acc: '#e9a23b', text: '#e6e6e6', soft: '#9b9b9b' };
  const MONO = '"Geist Mono", ui-monospace, Menlo, monospace', SANS = 'Geist, -apple-system, sans-serif';
  const cv = document.createElement('canvas'); document.body.appendChild(cv); const g = cv.getContext('2d');
  let k = 1, ox = 0, oy = 0, dpr = 1;
  function size() { dpr = Math.min(2, devicePixelRatio || 1); cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px'; k = Math.min(innerWidth / W, innerHeight / H); ox = (innerWidth - W * k) / 2; oy = (innerHeight - H * k) / 2; }
  addEventListener('resize', size); size();

  // ---- data: days x bins of concurrent jobs, per machine ----
  let grid = null, meta = [], maxV = 1, total = 0, peak = { v: 0, d: 0, b: 0 }, linked = false;
  // one continuous 10-minute concurrency series over the whole span, then overlapping ridges: each covers 24 h and the
  // next one starts 6 h later, so the terrain morphs smoothly from the oldest day (back) to the last 24 h (front)
  const STEP = 36;   // bins per ridge step (6 h)
  function build(jobs) {
    const now = Date.now(), js = jobs.filter((j) => (!j.kind || j.kind === 'job') && j.startedAt);
    const first = Math.min(...js.map((j) => j.startedAt), now - 6 * 864e5);
    const days = Math.max(7, Math.min(30, Math.ceil((now - first) / 864e5))), start = now - days * 864e5, NB = days * BINS;
    const series = new Float32Array(NB); total = 0;
    for (const j of js) { const s0 = j.startedAt, e = Math.min(j.endedAt || now, now); if (e < start) continue; if (s0 >= start) total++;
      for (let t = Math.max(s0, start); t < e; t += 6e5) series[Math.floor((t - start) / 6e5)] += 1; }
    const sm = series.slice(); for (let i = 1; i < NB - 1; i++) series[i] = (sm[i - 1] + 2 * sm[i] + sm[i + 1]) / 4;
    DAYS = Math.floor((NB - BINS) / STEP) + 1;
    grid = []; meta = [];
    for (let r = 0; r < DAYS; r++) { const off = r * STEP; grid.push(series.subarray(off, off + BINS)); meta.push({ t: start + (off + BINS) * 6e5, off }); }
    maxV = 1; peak = { v: 0, d: 0, b: 0 };
    grid.forEach((row, d) => row.forEach((v, b2) => { if (v > maxV) maxV = v; if (v > peak.v) peak = { v, d, b: b2 }; }));
    winStart = start; spanDays = days; linked = true;
  }
  let spanDays = 7;
  let winStart = 0;
  window.jtHistory64 = (b) => { try { build(JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b), (c) => c.charCodeAt(0))))); } catch {} };
  window.jtHistory = (arr) => build(arr);
  // until data arrives: a calm synthetic landscape so the saver never starts empty
  function demo() { const a = []; const now = Date.now(); for (let i = 0; i < 900; i++) { const s = now - Math.random() * 7 * 864e5, h = new Date(s).getHours(); if (h < 7 && Math.random() < .8) continue; a.push({ kind: 'job', machine: Math.random() < .5 ? 'remote' : 'local', startedAt: s, endedAt: s + 6e5 + Math.random() * 7.2e6 }); } build(a); linked = false; }
  demo();

  // ---- projection ----
  function proj(x, y, z, cam) {
    let c = Math.cos(cam.yaw), s = Math.sin(cam.yaw); [x, z] = [x * c - z * s, x * s + z * c];
    c = Math.cos(cam.pitch); s = Math.sin(cam.pitch); [y, z] = [y * c - z * s, y * s + z * c];
    z += cam.dist; const f = 900 / z; return [W / 2 + x * f, cam.cy - y * f, z];
  }
  const txt = (s, x, y, o = {}) => { g.font = `${o.w || 500} ${o.size || 9.5}px ${o.font || MONO}`; g.fillStyle = o.col || C.soft; g.textAlign = o.align || 'left'; if ('letterSpacing' in g) g.letterSpacing = (o.ls ?? 1.4) + 'px'; g.fillText(s, x, y); };
  const MON = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
  const p2 = (n) => String(n).padStart(2, '0');

  const t0 = performance.now(); let last = 0;
  function frame(now) {
    requestAnimationFrame(frame); if (now - last < 32) return; last = now;
    const t = STILL ? 14000 : now - t0;
    g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = C.bg; g.fillRect(0, 0, cv.width, cv.height);
    g.setTransform(dpr * k, 0, 0, dpr * k, dpr * ox, dpr * oy);
    const cam = { yaw: Math.sin(t / 26000) * .38, pitch: .44 + Math.sin(t / 19000) * .06, dist: 1000 + Math.sin(t / 31000) * 110, cy: 700 };
    const XW = 1240, ZS = 700 / DAYS, z0 = -DAYS / 2 * ZS, hgt = (v) => Math.sqrt(Math.max(0, v) / Math.max(4, maxV)) * 420;
    const cursor = STILL ? .62 : (t / 24000) % 1;   // time-of-day cursor, one sweep per 24 s
    // floor grid
    g.lineWidth = .6; g.strokeStyle = '#141414';
    for (let h = 0; h <= 24; h += 3) { const x = -XW / 2 + h / 24 * XW, a = proj(x, 0, z0, cam), b = proj(x, 0, z0 + DAYS * ZS, cam); g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); }
    // ridges back to front, each filled black underneath so nearer ridges hide farther ones
    for (let d = 0; d < DAYS; d++) {
      const z = z0 + d * ZS, row = grid[d], today = d === DAYS - 1;
      const pts = []; for (let b = 0; b <= BINS; b++) { const v = row[Math.min(BINS - 1, b)] * (1 + (today && !STILL ? .04 * Math.sin(t / 400 + b / 6) : 0)); pts.push(proj(-XW / 2 + b / BINS * XW, hgt(v), z, cam)); }
      const base0 = proj(-XW / 2, 0, z, cam), base1 = proj(XW / 2, 0, z, cam);
      g.beginPath(); g.moveTo(base0[0], base0[1]); for (const p of pts) g.lineTo(p[0], p[1]); g.lineTo(base1[0], base1[1]); g.closePath(); g.fillStyle = C.bg; g.fill();
      const depth = d / (DAYS - 1);
      g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]));
      g.strokeStyle = today ? C.acc : `rgba(214,214,214,${.18 + .62 * depth})`; g.lineWidth = today ? 2 : .9 + depth * .5; g.stroke();
      if (today) { g.save(); g.shadowColor = C.acc; g.shadowBlur = 14; g.stroke(); g.restore(); }
      // day label at the left end, every 5th day and today
      if (today || (DAYS - 1 - d) % Math.max(4, Math.ceil(DAYS / 8)) === 0) { const m = new Date(meta[d].t); txt(today ? 'LAST 24 H' : `${MON[m.getMonth()]} ${p2(m.getDate())}`, base0[0] - 14, base0[1] + 3, { size: 8, align: 'right', col: today ? C.acc : C.mid, w: today ? 600 : 500 });  }
    }
    // hour axis along the front edge
    const zf = z0 + DAYS * ZS + 14;
    for (let h = 0; h <= 24; h += 3) { const p = proj(-XW / 2 + h / 24 * XW, 0, zf, cam), ct = new Date(meta[DAYS - 1].t - 864e5 + h * 36e5); txt(h === 24 ? 'NOW' : p2(ct.getHours()) + ':' + p2(ct.getMinutes()), p[0], p[1] + 14, { size: 8, align: 'center', col: C.mid }); }
    // time cursor: a vertical plane sweeping the day, reading each ridge's value
    const cx = -XW / 2 + cursor * XW, cb = Math.floor(cursor * BINS) % BINS;
    const a = proj(cx, 0, z0, cam), b = proj(cx, 0, zf, cam), a2 = proj(cx, 260, z0, cam);
    g.strokeStyle = 'rgba(233,162,59,.55)'; g.lineWidth = 1; g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke();
    g.setLineDash([2, 4]); g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(a2[0], a2[1]); g.stroke(); g.setLineDash([]);
    let rowMax = 0, rowMaxD = 0;
    for (let d = 0; d < DAYS; d++) { const v = grid[d][cb], p = proj(cx, hgt(v), z0 + d * ZS, cam); if (v > rowMax) { rowMax = v; rowMaxD = d; } if (v > .3) { g.fillStyle = d === DAYS - 1 ? C.acc : 'rgba(233,162,59,.7)'; g.beginPath(); g.arc(p[0], p[1], d === DAYS - 1 ? 3.2 : 1.8, 0, Math.PI * 2); g.fill(); } }
    const ctd = new Date(meta[DAYS - 1].t - 864e5 + cursor * 864e5), bp = proj(cx, 0, zf, cam);
    txt(`${p2(ctd.getHours())}:${p2(Math.floor(ctd.getMinutes() / 10) * 10)}`, bp[0], bp[1] + 30, { size: 11, align: 'center', col: C.acc, w: 600 });
    txt(`LAST 24 H ${grid[DAYS - 1][cb].toFixed(1)} · BUSIEST ${rowMax.toFixed(1)} (${MON[new Date(meta[rowMaxD].t).getMonth()]} ${p2(new Date(meta[rowMaxD].t).getDate())})`, bp[0], bp[1] + 44, { size: 7.5, align: 'center', col: C.soft });
    // peak marker
    const pk = proj(-XW / 2 + peak.b / BINS * XW, hgt(peak.v), z0 + peak.d * ZS, cam);
    g.strokeStyle = C.line; g.lineWidth = .8; g.beginPath(); g.moveTo(pk[0], pk[1] - 4); g.lineTo(pk[0], pk[1] - 46); g.lineTo(pk[0] + 30, pk[1] - 46); g.stroke();
    const pd = new Date(meta[peak.d].t); txt(`PEAK ${Math.round(peak.v)} JOBS`, pk[0] + 34, pk[1] - 50, { size: 8.5, col: C.text, w: 600 }); const pt = new Date(winStart + (meta[peak.d].off + peak.b) * 6e5); txt(`${MON[pt.getMonth()]} ${p2(pt.getDate())} · ${p2(pt.getHours())}:${p2(Math.floor(pt.getMinutes() / 10) * 10)}`, pk[0] + 34, pk[1] - 38, { size: 7.5, col: C.mid });
    // title block, top-left
    txt(`${spanDays} days of work`, 64, 88, { font: SANS, size: 22, col: C.text, w: 600, ls: 0 });
    txt('TERRAIN · JOBS RUNNING AT ONCE', 64, 108, { size: 8.5, col: C.soft });
    txt(`${total.toLocaleString()} JOBS · ${linked ? 'MACBOOK PRO + MAC MINI' : 'SAMPLE DATA · WAITING FOR JOBTRAIL'}`, 64, 124, { size: 8, col: linked ? C.mid : C.dim });
    const n = new Date(); txt(`${p2(n.getHours())}:${p2(n.getMinutes())}`, W - 64, 96, { font: SANS, size: 30, col: C.text, w: 500, align: 'right', ls: 0 });
    txt(`${MON[n.getMonth()]} ${p2(n.getDate())} ${n.getFullYear()}`, W - 64, 116, { size: 8.5, col: C.soft, align: 'right' });
    // legend, bottom-left
    txt('EACH RIDGE = 24 H, ONE EVERY 6 H · HEIGHT = JOBS RUNNING AT ONCE (10-MIN STEPS, √ SCALE)', 64, H - 64, { size: 7.5, col: C.dim });
  }
  document.fonts?.ready.then(() => {});
  requestAnimationFrame(frame);
})();
</script>
</body></html>
